<!DOCTYPE html>
<html lang="th" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจัดการโปรโมชั่นและสินค้า</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    /* Custom Scrollbar & Animations */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0a1f1a;
    }
    ::-webkit-scrollbar-thumb {
      background: #1b4332;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #2d6a4f;
    }
    
    .card-hover {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card-hover:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px -10px rgba(16, 185, 129, 0.3);
    }
    
    .img-skeleton {
      background: linear-gradient(90deg, #122a22 25%, #1a3a2e 50%, #122a22 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
    }
    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .img-lazy {
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
    }
    .img-lazy.loaded {
      opacity: 1;
    }
  </style>
</head>
<body class="bg-[#07130e] text-gray-100 min-h-screen font-sans antialiased selection:bg-emerald-500 selection:text-white">

  <!-- Header / Navbar -->
  <header class="sticky top-0 z-50 bg-[#0a1f1a]/90 backdrop-blur-md border-b border-emerald-900/40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-emerald-600/20 rounded-xl border border-emerald-500/30 text-emerald-400">
          <i data-lucide="store" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg text-white leading-tight">ระบบจัดการหน้าร้าน</h1>
          <p class="text-xs text-emerald-400/80">ศูนย์รวมวัตถุดิบและโปรโมชั่น</p>
        </div>
      </div>

      <!-- Mode Admin Toggle Button -->
      <button id="admin-toggle-btn" onclick="toggleAdminMode()" class="px-3.5 py-1.5 rounded-lg border border-emerald-700/50 bg-[#122a22] text-xs font-medium text-emerald-300 hover:bg-emerald-900/50 transition flex items-center gap-2">
        <i data-lucide="shield" class="w-4 h-4"></i>
        <span id="admin-status-text">โหมดลูกค้า</span>
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-10">

    <!-- Section: Promotions Carousel -->
    <section class="space-y-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <i data-lucide="flame" class="w-5 h-5 text-amber-400"></i>
          <h2 class="text-xl font-bold text-white">โปรโมชั่นพิเศษ</h2>
        </div>
        
        <!-- Admin Add Promo Button -->
        <button onclick="openModal('modal-promo')" class="admin-only hidden bg-amber-500 hover:bg-amber-400 text-slate-950 font-semibold text-xs px-3.5 py-2 rounded-lg transition flex items-center gap-1.5 shadow-lg shadow-amber-500/20">
          <i data-lucide="plus-circle" class="w-4 h-4"></i> เพิ่มโปรโมชั่น
        </button>
      </div>

      <!-- Promotion Cards Slider Container -->
      <div class="relative overflow-hidden rounded-2xl bg-[#0a1f1a]/50 p-4 border border-emerald-900/30">
        <div id="promo-track" class="flex gap-4 overflow-x-auto pb-2 pt-1 scroll-smooth">
          <!-- Promo items will be rendered here dynamically -->
        </div>
      </div>
    </section>

    <!-- Section: Products Grid -->
    <section class="space-y-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <i data-lucide="shopping-bag" class="w-5 h-5 text-emerald-400"></i>
          <h2 class="text-xl font-bold text-white">รายการสินค้า</h2>
        </div>

        <!-- Admin Add Product Button -->
        <button onclick="openModal('modal-product')" class="admin-only hidden bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs px-3.5 py-2 rounded-lg transition flex items-center gap-1.5 shadow-lg shadow-emerald-600/20">
          <i data-lucide="plus-circle" class="w-4 h-4"></i> เพิ่มสินค้า
        </button>
      </div>

      <!-- Products Grid Display -->
      <div id="product-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
        <!-- Product items will be rendered here dynamically -->
      </div>
    </section>

  </main>

  <!-- Modal: Add Promotion -->
  <div id="modal-promo" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-[#122a22] border border-emerald-800/60 rounded-2xl w-full max-w-md p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b border-emerald-800/40 pb-3">
        <h3 class="text-base font-bold text-amber-400 flex items-center gap-2">
          <i data-lucide="badge-percent" class="w-5 h-5"></i> เพิ่มโปรโมชั่นใหม่
        </h3>
        <button onclick="closeModal('modal-promo')" class="text-gray-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <form id="form-promo" onsubmit="handleAddPromotion(event)" class="space-y-3 text-xs">
        <div>
          <label class="block text-gray-300 mb-1">ชื่อโปรโมชั่น / หัวข้อ</label>
          <input type="text" id="promo-title" required class="w-full bg-[#0a1f1a] border border-emerald-800 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-400">
        </div>
        <div>
          <label class="block text-gray-300 mb-1">รายละเอียด</label>
          <textarea id="promo-desc" rows="2" class="w-full bg-[#0a1f1a] border border-emerald-800 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-400"></textarea>
        </div>
        <div>
          <label class="block text-gray-300 mb-1">URL รูปภาพโปสเตอร์โปรโมชั่น</label>
          <input type="url" id="promo-img" placeholder="https://example.com/image.jpg" required class="w-full bg-[#0a1f1a] border border-emerald-800 rounded-lg p-2.5 text-white focus:outline-none focus:border-amber-400">
        </div>
        <div class="pt-2 flex justify-end gap-2">
          <button type="button" onclick="closeModal('modal-promo')" class="px-4 py-2 rounded-lg bg-gray-700 hover:bg-gray-600 text-gray-200">ยกเลิก</button>
          <button type="submit" class="px-4 py-2 rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold">บันทึก</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Add Product -->
  <div id="modal-product" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-[#122a22] border border-emerald-800/60 rounded-2xl w-full max-w-md p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b border-emerald-800/40 pb-3">
        <h3 class="text-base font-bold text-emerald-400 flex items-center gap-2">
          <i data-lucide="package-plus" class="w-5 h-5"></i> เพิ่มสินค้าใหม่
        </h3>
        <button onclick="closeModal('modal-product')" class="text-gray-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <form id="form-product" onsubmit="handleAddProduct(event)" class="space-y-3 text-xs">
        <div>
          <label class="block text-gray-300 mb-1">ชื่อสินค้า</label>
          <input type="text" id="prod-title" required class="w-full bg-[#0a1f1a] border border-emerald-800 rounded-lg p-2.5 text-white focus:outline-none focus:border-emerald-400">
        </div>
        <div>
          <label class="block text-gray-300 mb-1">ราคา (บาท)</label>
          <input type="number" step="0.01" id="prod-price" required class="w-full bg-[#0a1f1a] border border-emerald-800 rounded-lg p-2.5 text-white focus:outline-none focus:border-emerald-400">
        </div>
        <div>
          <label class="block text-gray-300 mb-1">URL รูปภาพสินค้า</label>
          <input type="url" id="prod-img" placeholder="https://example.com/image.jpg" required class="w-full bg-[#0a1f1a] border border-emerald-800 rounded-lg p-2.5 text-white focus:outline-none focus:border-emerald-400">
        </div>
        <div class="pt-2 flex justify-end gap-2">
          <button type="button" onclick="closeModal('modal-product')" class="px-4 py-2 rounded-lg bg-gray-700 hover:bg-gray-600 text-gray-200">ยกเลิก</button>
          <button type="submit" class="px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-bold">บันทึก</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JavaScript App Script -->
  <script>
    const PLACEHOLDER_SVG = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="%23059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>';
    
    let isAdmin = false;

    // Sample Data Initializer
    let allPromotions = [
      {
        id: 'promo-1',
        title: 'ปลาร้าแซ่บไมค์ โปรเด็ดลดพิเศษ',
        desc: 'ราคาพิเศษส่งท้ายโปรโมชั่น เพียงลังละ 680 บาทเมื่อซื้อ 10 ลังขึ้นไป',
        imageUrl: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=800&q=80'
      }
    ];

    let allProducts = [
      {
        id: 'prod-1',
        title: 'นกเหยี่ยว ครีมเทียมข้นจืด เอ็กซ์ตร้า 1,000 มล.',
        price: 610.00,
        imageUrl: 'https://images.unsplash.com/photo-1563636619-e9143da7973b?auto=format&fit=crop&w=500&q=80'
      },
      {
        id: 'prod-2',
        title: 'ครีมเทียมพร้อมไขมัน ทีพอด เอ็กซ์ตร้า 1,000 มล.',
        price: 600.00,
        imageUrl: 'https://images.unsplash.com/photo-1550583724-b2692b85b150?auto=format&fit=crop&w=500&q=80'
      }
    ];

    document.addEventListener("DOMContentLoaded", () => {
      renderPromotions();
      renderProducts();
      lucide.createIcons();
    });

    function toggleAdminMode() {
      isAdmin = !isAdmin;
      const statusText = document.getElementById("admin-status-text");
      const adminElements = document.querySelectorAll(".admin-only");
      
      if (isAdmin) {
        statusText.innerText = "โหมดผู้ดูแลระบบ (Admin)";
        adminElements.forEach(el => el.classList.remove("hidden"));
      } else {
        statusText.innerText = "โหมดลูกค้า";
        adminElements.forEach(el => el.classList.add("hidden"));
      }
      
      renderPromotions();
      renderProducts();
    }

    /* === Render Promotions (ปรับปรุงเฉพาะส่วนรูปภาพโปรโมชั่น) === */
    function renderPromotions() {
      const track = document.getElementById("promo-track");
      track.innerHTML = "";

      if (allPromotions.length === 0) {
        track.innerHTML = `<p class="text-gray-400 w-full text-center py-8 bg-[#122a22]/40 rounded-xl text-xs">ไม่มีโปรโมชั่นในขณะนี้</p>`;
        return;
      }

      const createPromoCards = (list) => {
        return list.map((p, index) => {
          const img = p.imageUrl || PLACEHOLDER_SVG;
          const fetchPriority = index === 0 ? 'fetchpriority="high"' : 'loading="lazy"';
          
          return `
            <div class="shrink-0 w-[280px] sm:w-[320px] bg-[#122a22] rounded-2xl overflow-hidden border border-emerald-800/40 card-hover flex flex-col justify-between shadow-xl cursor-pointer">
              <!-- ปรับส่วนกรอบรูปภาพเป็น aspect-square และ object-contain เพื่อรองรับทั้งรูปแนวนอน แนวตั้ง และจัตุรัสโดยไม่โดนครอบตัด -->
              <div class="relative w-full aspect-square bg-[#0a1f1a] img-skeleton overflow-hidden flex items-center justify-center p-1">
                <img src="${img}" ${fetchPriority} 
                     alt="${p.title}"
                     class="img-lazy w-full h-full object-contain rounded-xl" 
                     onload="this.classList.add('loaded'); this.parentElement.classList.remove('img-skeleton');"
                     onerror="this.src='${PLACEHOLDER_SVG}'; this.classList.add('loaded');">
                <span class="absolute top-3 left-3 bg-amber-500 text-slate-950 font-extrabold text-[10px] px-2.5 py-1 rounded-full shadow z-10">PROMOTION</span>
              </div>
              
              <div class="p-3.5 bg-[#122a22] border-t border-emerald-900/50 flex flex-col justify-between flex-1">
                <div>
                  <h3 class="text-sm sm:text-base font-bold text-amber-300 line-clamp-1">${p.title}</h3>
                  <p class="text-xs text-gray-300 mt-1 line-clamp-2">${p.desc}</p>
                </div>
                <div class="admin-only ${isAdmin ? '' : 'hidden'} mt-3 pt-2 border-t border-emerald-900/40 flex justify-end">
                  <button onclick="deleteItem('Promotions', '${p.id}')" class="bg-red-600/20 hover:bg-red-600 text-red-300 hover:text-white border border-red-500/30 text-xs px-3 py-1.5 rounded-lg transition flex items-center gap-1">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> ลบโปรโมชั่น
                  </button>
                </div>
              </div>
            </div>
          `;
        }).join('');
      };

      let htmlContent = createPromoCards(allPromotions);
      if (allPromotions.length > 1) {
        htmlContent += createPromoCards(allPromotions);
      }

      track.innerHTML = htmlContent;
      lucide.createIcons();
    }

    /* === Render Products === */
    function renderProducts() {
      const grid = document.getElementById("product-grid");
      grid.innerHTML = "";

      if (allProducts.length === 0) {
        grid.innerHTML = `<p class="text-gray-400 col-span-full text-center py-8 bg-[#122a22]/40 rounded-xl text-xs">ไม่มีสินค้าในขณะนี้</p>`;
        return;
      }

      grid.innerHTML = allProducts.map((prod) => {
        const img = prod.imageUrl || PLACEHOLDER_SVG;
        return `
          <div class="bg-[#122a22] rounded-xl overflow-hidden border border-emerald-800/40 card-hover flex flex-col justify-between p-3">
            <div class="w-full aspect-square bg-[#0a1f1a] rounded-lg overflow-hidden img-skeleton relative mb-2">
              <img src="${img}" loading="lazy" alt="${prod.title}" class="img-lazy w-full h-full object-cover"
                   onload="this.classList.add('loaded'); this.parentElement.classList.remove('img-skeleton');"
                   onerror="this.src='${PLACEHOLDER_SVG}'; this.classList.add('loaded');">
            </div>
            <div class="space-y-1 flex-1 flex flex-col justify-between">
              <h4 class="text-xs font-semibold text-gray-200 line-clamp-2">${prod.title}</h4>
              <p class="text-sm font-bold text-emerald-400">฿${Number(prod.price).toLocaleString('th-TH', {minimumFractionDigits: 2})}</p>
            </div>
            <div class="admin-only ${isAdmin ? '' : 'hidden'} mt-2 pt-2 border-t border-emerald-900/40 flex justify-end">
              <button onclick="deleteItem('Products', '${prod.id}')" class="text-red-400 hover:text-red-300 text-xs flex items-center gap-1">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> ลบ
              </button>
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    /* Modal Functions */
    function openModal(id) {
      document.getElementById(id).classList.remove("hidden");
    }
    function closeModal(id) {
      document.getElementById(id).classList.add("hidden");
    }

    /* Add Data Functions */
    function handleAddPromotion(e) {
      e.preventDefault();
      const title = document.getElementById("promo-title").value;
      const desc = document.getElementById("promo-desc").value;
      const imageUrl = document.getElementById("promo-img").value;

      allPromotions.push({ id: 'promo-' + Date.now(), title, desc, imageUrl });
      renderPromotions();
      closeModal('modal-promo');
      document.getElementById("form-promo").reset();
    }

    function handleAddProduct(e) {
      e.preventDefault();
      const title = document.getElementById("prod-title").value;
      const price = parseFloat(document.getElementById("prod-price").value);
      const imageUrl = document.getElementById("prod-img").value;

      allProducts.push({ id: 'prod-' + Date.now(), title, price, imageUrl });
      renderProducts();
      closeModal('modal-product');
      document.getElementById("form-product").reset();
    }

    function deleteItem(type, id) {
      if (!confirm("คุณต้องการลบรายการนี้ใช่หรือไม่?")) return;
      if (type === 'Promotions') {
        allPromotions = allPromotions.filter(item => item.id !== id);
        renderPromotions();
      } else {
        allProducts = allProducts.filter(item => item.id !== id);
        renderProducts();
      }
    }
  </script>
</body>
</html>
