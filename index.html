<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>กมลพาณิช - รายการสินค้าและโปรโมชั่น</title>
  
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { font-family: 'Noto Sans Thai', sans-serif; }
    .card-hover { transition: transform 0.2s, box-shadow 0.2s; }
    .card-hover:hover { transform: translateY(-4px); box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
  </style>
</head>

<body class="w-full min-h-screen bg-[#0a1f1a] text-white selection:bg-amber-500 selection:text-slate-900">

  <!-- Header -->
  <header class="relative w-full py-12 md:py-20 px-4 overflow-hidden border-b border-emerald-900/40 text-center">
   <div class="relative z-10 max-w-6xl mx-auto flex flex-col items-center">
    <div class="mb-3 text-[#c9a84c] p-3 bg-emerald-950/80 rounded-2xl border border-emerald-700/40">
     <i data-lucide="shopping-cart" class="w-10 h-10 md:w-14 md:h-14"></i>
    </div>
    <h1 class="text-3xl md:text-6xl font-extrabold text-white mb-2">กมลพาณิช</h1>
    <p class="text-amber-300 font-medium text-base md:text-xl mb-6">ครบครัน สินค้าเพื่อองค์กรและร้านค้า</p>
    
    <div class="bg-[#c9a84c] text-[#0a1f1a] px-6 py-2 rounded-full font-bold text-xs md:text-sm flex items-center gap-2">
      <i data-lucide="clock" class="w-4 h-4"></i> เปิดบริการทุกวัน 07.00 - 17.00 น.
    </div>
   </div>
  </header>

  <!-- Promotions Section -->
  <section class="w-full bg-[#0d2419] py-10 px-4 border-b border-emerald-900/30">
   <div class="max-w-6xl mx-auto">
    <div class="flex justify-between items-center mb-6">
      <div>
        <h2 class="text-xl md:text-2xl font-bold text-amber-400 flex items-center gap-2">
          <i data-lucide="sparkles" class="w-5 h-5"></i> โปรโมชั่นพิเศษ
        </h2>
      </div>
      <button onclick="openModal('modal-promo')" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-4 py-2 rounded-xl text-xs md:text-sm flex items-center gap-1.5 shadow-lg transition">
        <i data-lucide="plus-circle" class="w-4 h-4"></i> เพิ่มโปรโมชั่น
      </button>
    </div>

    <div id="promo-list" class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="col-span-full text-center py-10 text-gray-400 flex flex-col items-center gap-2">
        <i data-lucide="loader-2" class="w-7 h-7 animate-spin text-amber-400"></i>
        <span>กำลังโหลดข้อมูลโปรโมชั่น...</span>
      </div>
    </div>
   </div>
  </section>

  <!-- Products Section -->
  <section class="w-full bg-[#0f2920] py-10 px-4">
   <div class="max-w-6xl mx-auto">
    <div class="flex justify-between items-center mb-6">
      <div>
        <h2 class="text-xl md:text-2xl font-bold text-amber-400 flex items-center gap-2">
          <i data-lucide="layout-grid" class="w-5 h-5"></i> แคตตาล็อกสินค้า
        </h2>
      </div>
      <button onclick="openModal('modal-product')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2 rounded-xl text-xs md:text-sm flex items-center gap-1.5 shadow-lg transition">
        <i data-lucide="plus-circle" class="w-4 h-4"></i> เพิ่มสินค้าใหม่
      </button>
    </div>

    <!-- Category Filter Buttons -->
    <div class="flex flex-wrap gap-2 mb-6 border-b border-emerald-900/60 pb-4">
      <button id="btn-cat-all" onclick="filterCat('all')" class="cat-btn bg-emerald-700 text-amber-300 px-3.5 py-1.5 rounded-lg text-xs font-semibold">ทั้งหมด</button>
      <button id="btn-cat-อุปโภคบริโภค" onclick="filterCat('อุปโภคบริโภค')" class="cat-btn bg-[#122a22] text-gray-300 px-3.5 py-1.5 rounded-lg text-xs font-medium">สินค้าอุปโภค บริโภค</button>
      <button id="btn-cat-เบ็ดเตล็ด" onclick="filterCat('เบ็ดเตล็ด')" class="cat-btn bg-[#122a22] text-gray-300 px-3.5 py-1.5 rounded-lg text-xs font-medium">สินค้าเบ็ดเตล็ด</button>
      <button id="btn-cat-บรรจุภัณฑ์" onclick="filterCat('บรรจุภัณฑ์')" class="cat-btn bg-[#122a22] text-gray-300 px-3.5 py-1.5 rounded-lg text-xs font-medium">สินค้าบรรจุภัณฑ์</button>
      <button id="btn-cat-ถุงพลาสติก" onclick="filterCat('ถุงพลาสติก')" class="cat-btn bg-[#122a22] text-gray-300 px-3.5 py-1.5 rounded-lg text-xs font-medium">ถุงพลาสติก</button>
    </div>

    <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">
      <div class="col-span-full text-center py-10 text-gray-400 flex flex-col items-center gap-2">
        <i data-lucide="loader-2" class="w-7 h-7 animate-spin text-emerald-400"></i>
        <span>กำลังโหลดรายการสินค้า...</span>
      </div>
    </div>
   </div>
  </section>

  <!-- Modal Promo -->
  <div id="modal-promo" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-[#122a22] border border-emerald-700/50 rounded-2xl p-5 w-full max-w-md shadow-2xl">
      <div class="flex justify-between items-center mb-4 pb-2 border-b border-emerald-800">
        <h3 class="text-base font-bold text-amber-400">เพิ่มโปรโมชั่นใหม่</h3>
        <button onclick="closeModal('modal-promo')" class="text-gray-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <form id="form-promo" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1">หัวข้อโปรโมชั่น</label>
          <input type="text" id="promo-title" required class="w-full bg-[#0a1f1a] border border-emerald-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-400">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1">รายละเอียด</label>
          <textarea id="promo-desc" rows="2" required class="w-full bg-[#0a1f1a] border border-emerald-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-400"></textarea>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1">รูปภาพโปรโมชั่น</label>
          <input type="file" id="promo-file" accept="image/*" class="w-full text-xs text-gray-300 bg-[#0a1f1a] rounded-xl border border-emerald-800 p-2">
        </div>
        <button type="submit" id="btn-submit-promo" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-2.5 rounded-xl text-xs transition mt-2">บันทึกโปรโมชั่น</button>
      </form>
    </div>
  </div>

  <!-- Modal Product -->
  <div id="modal-product" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-[#122a22] border border-emerald-700/50 rounded-2xl p-5 w-full max-w-md shadow-2xl">
      <div class="flex justify-between items-center mb-4 pb-2 border-b border-emerald-800">
        <h3 class="text-base font-bold text-amber-400">เพิ่มสินค้าใหม่</h3>
        <button onclick="closeModal('modal-product')" class="text-gray-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <form id="form-product" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1">ชื่อสินค้า</label>
          <input type="text" id="prod-name" required class="w-full bg-[#0a1f1a] border border-emerald-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-400">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1">หมวดหมู่</label>
          <select id="prod-cat" class="w-full bg-[#0a1f1a] border border-emerald-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
            <option value="อุปโภคบริโภค">สินค้าอุปโภค บริโภค</option>
            <option value="เบ็ดเตล็ด">สินค้าเบ็ดเตล็ด</option>
            <option value="บรรจุภัณฑ์">สินค้าบรรจุภัณฑ์</option>
            <option value="ถุงพลาสติก">ถุงพลาสติก</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1">ราคา (บาท)</label>
          <input type="number" id="prod-price" required class="w-full bg-[#0a1f1a] border border-emerald-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1">รูปภาพสินค้า</label>
          <input type="file" id="prod-file" accept="image/*" class="w-full text-xs text-gray-300 bg-[#0a1f1a] rounded-xl border border-emerald-800 p-2">
        </div>
        <button type="submit" id="btn-submit-prod" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl text-xs transition mt-2">บันทึกสินค้า</button>
      </form>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbygaYUXxWuoc87C_ZtdOpZ7GyhBOJownFVEdwgck3WfWPzENDP7BEagHHLKZmVbAHYfhg/exec";

    let allPromotions = [];
    let allProducts = [];
    let currentCat = 'all';

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      loadData();
    });

    async function loadData() {
      try {
        const res = await fetch(GOOGLE_SCRIPT_URL);
        const data = await res.json();
        
        allPromotions = data.promotions || [];
        allProducts = data.products || [];

        renderPromotions();
        renderProducts();
      } catch (err) {
        console.error("Load error:", err);
      }
    }

    function renderPromotions() {
      const container = document.getElementById("promo-list");
      container.innerHTML = "";

      if (allPromotions.length === 0) {
        container.innerHTML = `<p class="text-gray-400 col-span-2 text-center py-8 bg-[#122a22]/40 rounded-xl">ไม่มีโปรโมชั่น</p>`;
        return;
      }

      allPromotions.forEach(p => {
        const img = p.imageUrl || 'https://via.placeholder.com/400x200?text=No+Image';
        container.innerHTML += `
          <div id="promo-card-${p.id}" class="relative rounded-2xl overflow-hidden card-hover h-56 bg-[#122a22] border border-emerald-800/40 shadow-xl group">
            <img src="${img}" loading="lazy" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent flex flex-col justify-end p-5">
              <h3 class="text-lg font-bold text-amber-300">${p.title}</h3>
              <p class="text-xs text-gray-200 mt-1 line-clamp-2">${p.desc}</p>
              <div class="mt-3">
                <button onclick="deleteItem('Promotions', '${p.id}')" class="bg-red-600/80 hover:bg-red-600 text-white text-xs px-3 py-1 rounded-lg transition flex items-center gap-1">
                  <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> ลบโปรโมชั่น
                </button>
              </div>
            </div>
          </div>
        `;
      });
      lucide.createIcons();
    }

    function renderProducts() {
      const container = document.getElementById("product-grid");
      container.innerHTML = "";

      const filtered = currentCat === 'all' 
        ? allProducts 
        : allProducts.filter(p => p.category === currentCat);

      if (filtered.length === 0) {
        container.innerHTML = `<p class="text-gray-400 col-span-full text-center py-8 bg-[#122a22]/40 rounded-xl">ไม่มีสินค้าในหมวดหมู่นี้</p>`;
        return;
      }

      filtered.forEach(p => {
        const img = p.imageUrl || 'https://via.placeholder.com/300x300?text=No+Image';
        container.innerHTML += `
          <div id="prod-card-${p.id}" class="bg-[#122a22] rounded-2xl overflow-hidden border border-emerald-800/40 card-hover flex flex-col justify-between shadow-lg">
            <div>
              <div class="relative h-40 w-full bg-slate-900 overflow-hidden">
                <img src="${img}" loading="lazy" class="w-full h-full object-cover">
                <span class="absolute top-2 left-2 text-[10px] text-amber-300 bg-black/70 px-2 py-0.5 rounded-full font-semibold">${p.category}</span>
              </div>
              <div class="p-3">
                <h4 class="font-bold text-sm text-white line-clamp-1">${p.name}</h4>
                <p class="text-amber-400 font-extrabold text-base mt-1">${Number(p.price).toLocaleString()} <span class="text-xs text-gray-400 font-normal">บาท</span></p>
              </div>
            </div>
            <div class="p-3 pt-0">
              <button onclick="deleteItem('Products', '${p.id}')" class="bg-red-600/20 hover:bg-red-600 text-red-300 hover:text-white border border-red-500/30 text-xs px-3 py-1.5 rounded-lg w-full transition flex items-center justify-center gap-1">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> ลบสินค้า
              </button>
            </div>
          </div>
        `;
      });
      lucide.createIcons();
    }

    function filterCat(cat) {
      currentCat = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.remove('bg-emerald-700', 'text-amber-300');
        btn.classList.add('bg-[#122a22]', 'text-gray-300');
      });
      const activeBtn = document.getElementById(`btn-cat-${cat}`);
      if(activeBtn) {
        activeBtn.classList.remove('bg-[#122a22]', 'text-gray-300');
        activeBtn.classList.add('bg-emerald-700', 'text-amber-300');
      }
      renderProducts();
    }

    // บีบอัดภาพให้อยู่ในขนาด 15 - 25 KB ส่งไวกว่าเดิม 10 เท่า
    function compressImage(file, maxWidth = 380, quality = 0.35) {
      return new Promise((resolve) => {
        if (!file) return resolve({ fileData: null, fileName: null });

        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            resolve({
              fileData: canvas.toDataURL('image/jpeg', quality),
              fileName: `img_${Date.now()}.jpg`
            });
          };
          img.onerror = () => resolve({ fileData: null, fileName: null });
        };
        reader.onerror = () => resolve({ fileData: null, fileName: null });
      });
    }

    async function sendPostData(payload) {
      return fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload)
      });
    }

    // Submit Promo (เด้งขึ้นทันที)
    document.getElementById("form-promo").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btn-submit-promo");
      btn.disabled = true;
      btn.innerText = "กำลังบันทึก...";

      try {
        const file = document.getElementById("promo-file").files[0];
        const imageData = await compressImage(file);
        const tempId = "PR" + Date.now();

        const title = document.getElementById("promo-title").value;
        const desc = document.getElementById("promo-desc").value;
        const imageUrl = imageData.fileData || '';

        allPromotions.unshift({ id: tempId, title, desc, imageUrl });
        renderPromotions();

        closeModal('modal-promo');
        e.target.reset();

        await sendPostData({ action: "addPromotion", title, desc, fileData: imageData.fileData, fileName: imageData.fileName });
      } catch (err) {
        alert("เกิดข้อผิดพลาด");
      } finally {
        btn.disabled = false;
        btn.innerText = "บันทึกโปรโมชั่น";
      }
    });

    // Submit Product (เด้งขึ้นทันที)
    document.getElementById("form-product").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btn-submit-prod");
      btn.disabled = true;
      btn.innerText = "กำลังบันทึก...";

      try {
        const file = document.getElementById("prod-file").files[0];
        const imageData = await compressImage(file);
        const tempId = "PD" + Date.now();

        const name = document.getElementById("prod-name").value;
        const price = document.getElementById("prod-price").value;
        const category = document.getElementById("prod-cat").value;
        const imageUrl = imageData.fileData || '';

        allProducts.unshift({ id: tempId, name, price, category, imageUrl });
        renderProducts();

        closeModal('modal-product');
        e.target.reset();

        await sendPostData({ action: "addProduct", name, price, category, fileData: imageData.fileData, fileName: imageData.fileName });
      } catch (err) {
        alert("เกิดข้อผิดพลาด");
      } finally {
        btn.disabled = false;
        btn.innerText = "บันทึกสินค้า";
      }
    });

    // ลบรายการแล้วหายไปจากหน้าจอทันที ไม่ต้องรีเฟรช
    async function deleteItem(sheetName, id) {
      if (confirm("ยืนยันการลบรายการนี้?")) {
        if (sheetName === "Promotions") {
          allPromotions = allPromotions.filter(item => String(item.id) !== String(id));
          renderPromotions();
        } else {
          allProducts = allProducts.filter(item => String(item.id) !== String(id));
          renderProducts();
        }

        sendPostData({ action: "delete", sheetName, id });
      }
    }

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
  </script>
</body>
</html>
