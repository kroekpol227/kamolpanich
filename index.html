<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>กมลพาณิช - รายการสินค้าและหมวดหมู่</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <!-- Thai Font (Noto Sans Thai) -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { 
      font-family: 'Noto Sans Thai', sans-serif; 
    }
    
    .card-hover { 
      transition: transform 0.2s, box-shadow 0.2s; 
    }
    .card-hover:hover { 
      transform: translateY(-4px); 
      box-shadow: 0 10px 25px rgba(0,0,0,0.4); 
    }

    /* Skeleton Loading สำหรับรูปภาพ */
    .img-skeleton {
      background: linear-gradient(90deg, #122a22 25%, #1a3a2f 50%, #122a22 75%);
      background-size: 200% 100%;
      animation: skeleton-loading 1.5s infinite;
    }
    @keyframes skeleton-loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* สไลด์โปรโมชั่นแบบวิ่งวนลูปต่อเนื่อง */
    @keyframes smoothScroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .animate-smooth-scroll {
      display: flex;
      width: max-content;
      animation: smoothScroll 25s linear infinite;
    }
    .animate-smooth-scroll:hover {
      animation-play-state: paused;
    }
  </style>
</head>

<body class="w-full min-h-screen bg-[#0a1f1a] text-white selection:bg-amber-500 selection:text-slate-900 flex flex-col justify-between overflow-x-hidden">

  <div>
    <!-- Header ส่วนหัวร้านค้า -->
    <header class="relative w-full py-8 md:py-12 px-4 border-b border-emerald-900/40 text-center bg-[#071713]">
      <div class="relative z-10 max-w-6xl mx-auto flex flex-col items-center">
        <h1 class="text-3xl md:text-5xl font-extrabold text-amber-400 mb-1 tracking-tight">กมลพาณิช</h1>
        <p class="text-gray-300 font-medium text-xs md:text-base">จำหน่ายสินค้าอุปโภค-บริโภค บรรจุภัณฑ์ และสินค้าเบ็ดเตล็ด</p>
      </div>
    </header>

    <!-- Promotions Section แถบโปรโมชั่นวิ่ง -->
    <section class="w-full bg-[#0d2419] py-5 border-b border-emerald-900/30 overflow-hidden">
      <div class="max-w-7xl mx-auto px-4 mb-3">
        <h2 class="text-base md:text-lg font-bold text-amber-400 flex items-center gap-2">
          <i data-lucide="sparkles" class="w-5 h-5"></i> โปรโมชั่นพิเศษประจำเดือน
        </h2>
      </div>

      <div class="w-full overflow-hidden relative">
        <div id="promo-track" class="animate-smooth-scroll flex gap-4 px-4">
          <!-- โหลดโปรโมชั่นผ่าน JS -->
        </div>
      </div>
    </section>

    <!-- Main Container (Sidebar หมวดหมู่ + Grid รายการสินค้า) -->
    <section class="max-w-7xl mx-auto px-4 py-6 w-full">

      <!-- ปุ่มเลือกหมวดหมู่สำหรับ Mobile (แสดงเฉพาะบนมือถือ) -->
      <div class="md:hidden mb-4">
        <button onclick="toggleMobileSidebar(true)" class="w-full bg-[#122a22] border border-emerald-700/60 hover:border-amber-400 text-amber-300 font-bold px-4 py-3 rounded-xl flex justify-between items-center shadow-md active:scale-[0.99] transition">
          <span class="flex items-center gap-2">
            <i data-lucide="list-tree" class="w-5 h-5"></i>
            <span id="mobile-category-title">เลือกหมวดหมู่สินค้า</span>
          </span>
          <i data-lucide="chevron-down" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="flex flex-col md:flex-row gap-6">

        <!-- Sidebar Menu หมวดหมู่ซ้อนหมวดหมู่ -->
        <aside id="sidebar-container" class="hidden md:block w-full md:w-64 shrink-0 bg-[#122a22] border border-emerald-800/50 rounded-2xl p-4 h-fit sticky top-4 shadow-xl z-40">
          <div class="flex justify-between items-center mb-4 pb-2 border-b border-emerald-800/60">
            <h3 class="font-bold text-amber-400 text-base flex items-center gap-2">
              <i data-lucide="layers" class="w-5 h-5"></i> หมวดหมู่สินค้า
            </h3>
            <!-- ปุ่มปิดหมวดหมู่บนมือถือ -->
            <button onclick="toggleMobileSidebar(false)" class="md:hidden text-gray-400 hover:text-white p-1">
              <i data-lucide="x" class="w-6 h-6"></i>
            </button>
          </div>

          <!-- เมนูซ้อนหมวดหมู่ (Accordion Category Tree) -->
          <div id="category-tree" class="space-y-1">
            <!-- โหลดหมวดหมู่ผ่าน JS -->
          </div>
        </aside>

        <!-- Product Grid Display Container -->
        <main class="flex-1">
          <!-- Header แสดงหมวดหมู่ที่เลือก -->
          <div class="mb-4 flex justify-between items-center bg-[#122a22]/60 p-3.5 rounded-xl border border-emerald-900/50">
            <h3 id="selected-cat-label" class="text-base font-bold text-white flex items-center gap-2">
              <i data-lucide="grid" class="w-4 h-4 text-amber-400"></i> ทั้งหมด
            </h3>
            <span id="product-count" class="text-xs text-gray-400 bg-emerald-950 px-2.5 py-1 rounded-full border border-emerald-800/50">0 รายการ</span>
          </div>

          <!-- ตารางสินค้า Grid -->
          <div id="product-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-4">
            <!-- โหลดสินค้าผ่าน JS -->
          </div>
        </main>

      </div>
    </section>
  </div>

  <!-- Footer -->
  <footer class="w-full border-t border-emerald-900/40 py-6 text-center text-xs text-gray-500 bg-[#071713] mt-10">
    <p>© 2026 กมลพาณิช - สงวนลิขสิทธิ์ทุกประการ</p>
  </footer>

  <!-- Script การทำงานหลัก -->
  <script>
    // 1. โครงสร้างข้อมูลหมวดหมู่ซ้อนหมวดหมู่ (Nested Categories Data)
    const categoryData = [
      {
        id: 'cat-1',
        name: 'สินค้าอุปโภค บริโภค',
        subcategories: ['เครื่องดื่ม', 'ขนมขบเคี้ยว', 'เครื่องปรุงรส']
      },
      {
        id: 'cat-2',
        name: 'สินค้าเบ็ดเตล็ด',
        subcategories: ['เชือกฟาง', 'ถุงมือ', 'ไฟแช็ค', 'สก็อตไบร์/ฝอยขัดหม้อ', 'แรปห่ออาหาร', 'กระดาษฟอยล์', 'สมุดฉีก/บิล', 'กระดาษทิชชู', 'เชือก']
      },
      {
        id: 'cat-3',
        name: 'บรรจุภัณฑ์',
        subcategories: ['กล่องอาหาร', 'แก้วพลาสติก', 'หลอดกาแฟ']
      },
      {
        id: 'cat-4',
        name: 'ถุงพลาสติก',
        subcategories: ['ถุงหิ้ว', 'ถุงร้อน/ถุงเย็น', 'ถุงขยะ']
      }
    ];

    // 2. ข้อมูลสินค้าตัวอย่าง
    const mockProducts = [
      { id: 1, name: 'เชือกฟางผ่า 2 คละสี (1ลัง * 6โหล 72ม้วน)', subcat: 'เชือกฟาง', price: 120, img: 'https://images.unsplash.com/photo-1590483736622-39da86788730?w=400&q=80' },
      { id: 2, name: 'เชือกฟางใหญ่ เบา คละสี (1ลัง * 6โหล)', subcat: 'เชือกฟาง', price: 150, img: 'https://images.unsplash.com/photo-1590483736622-39da86788730?w=400&q=80' },
      { id: 3, name: 'เชือกฟางผ่า 4 (1ลัง * 6โหล)', subcat: 'เชือกฟาง', price: 130, img: 'https://images.unsplash.com/photo-1590483736622-39da86788730?w=400&q=80' },
      { id: 4, name: 'เชือกม้วนเล็ก 5 บาท (1ลัง * 120ม้วน)', subcat: 'เชือกฟาง', price: 110, img: 'https://images.unsplash.com/photo-1590483736622-39da86788730?w=400&q=80' },
      { id: 5, name: 'ถุงมือผ้าสีขาวอย่างดี (1 โหล)', subcat: 'ถุงมือ', price: 95, img: 'https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=400&q=80' },
      { id: 6, name: 'ไฟแช็คแบบจุดติดง่าย (แพ็ก 10 ชิ้น)', subcat: 'ไฟแช็ค', price: 50, img: 'https://images.unsplash.com/photo-1558611848-73f7eb4001a1?w=400&q=80' },
      { id: 7, name: 'สก็อตไบร์พร้อมฟองน้ำ ขัดสะอาด', subcat: 'สก็อตไบร์/ฝอยขัดหม้อ', price: 45, img: 'https://images.unsplash.com/photo-1585421514284-efb74c2b69ba?w=400&q=80' },
      { id: 8, name: 'กระดาษทิชชูม้วนยาว ประหยัดคุ้มค่า', subcat: 'กระดาษทิชชู', price: 80, img: 'https://images.unsplash.com/photo-1584556812952-905ffd0c611a?w=400&q=80' },
    ];

    // 3. ข้อมูลโปรโมชั่นสำหรับแถบสไลด์
    const mockPromotions = [
      { id: 1, title: 'เชือกฟางยกลัง ซื้อ 5 ลัง ฟรี 1 ลัง!', tag: 'ขายดี', bg: 'from-amber-500 to-amber-700' },
      { id: 2, title: 'ลดพิเศษ! ถุงมือผ้าสีขาว ลดทันที 10%', tag: 'Hot', bg: 'from-emerald-600 to-teal-800' },
      { id: 3, title: 'สั่งซื้อครบ 2,000 บาท ส่งฟรีในพื้นที่!', tag: 'ส่งฟรี', bg: 'from-amber-600 to-orange-700' }
    ];

    let currentSelectedSubcat = 'ทั้งหมด';

    // เริ่มทำงานเมื่อโหลด DOM เสร็จสิ้น
    document.addEventListener("DOMContentLoaded", () => {
      renderPromotions();
      renderCategorySidebar();
      renderProducts(currentSelectedSubcat);
      lucide.createIcons();
    });

    // แสดงผลโปรโมชั่นวิ่ง
    function renderPromotions() {
      const track = document.getElementById("promo-track");
      // ทำการซ้ำข้อมูลโปรโมชั่นเพื่อให้สไลด์วนลูปต่อเนื่องได้ไม่ขาดช่วง
      const items = [...mockPromotions, ...mockPromotions, ...mockPromotions];
      
      track.innerHTML = items.map(p => `
        <div class="bg-gradient-to-r ${p.bg} rounded-xl p-3 min-w-[260px] md:min-w-[320px] shadow-lg border border-white/10 flex items-center gap-3">
          <span class="bg-white/20 text-white text-[10px] font-extrabold px-2 py-1 rounded-md uppercase tracking-wider shrink-0">${p.tag}</span>
          <p class="text-xs md:text-sm font-bold text-white truncate">${p.title}</p>
        </div>
      `).join('');
    }

    // แสดงผล Sidebar เมนูซ้อนหมวดหมู่ (Nested Accordion)
    function renderCategorySidebar() {
      const container = document.getElementById("category-tree");
      
      let html = `
        <button onclick="selectSubcategory('ทั้งหมด')" class="w-full text-left px-3 py-2 rounded-xl text-xs font-semibold ${currentSelectedSubcat === 'ทั้งหมด' ? 'bg-amber-400 text-slate-900 font-bold' : 'text-gray-300 hover:bg-emerald-900/50 hover:text-amber-300'} transition flex justify-between items-center mb-2">
          <span>แสดงทั้งหมด</span>
        </button>
      `;

      categoryData.forEach(cat => {
        html += `
          <div class="border-b border-emerald-900/40 last:border-0 pb-1">
            <!-- ปุ่มหมวดหมู่หลัก ( Main Category ) -->
            <button onclick="toggleCategoryAccordion('${cat.id}')" class="w-full text-left px-3 py-2.5 rounded-xl text-xs md:text-sm font-bold text-gray-200 hover:text-amber-400 flex justify-between items-center transition group">
              <span class="group-hover:translate-x-0.5 transition-transform">${cat.name}</span>
              <i id="icon-${cat.id}" data-lucide="chevron-down" class="w-4 h-4 transition-transform duration-200 text-gray-400"></i>
            </button>
            
            <!-- รายการหมวดหมู่ย่อยซ้อนอยู่ข้างใน ( Subcategories Tree ) -->
            <div id="sub-${cat.id}" class="hidden pl-3 space-y-1 mt-1 border-l-2 border-emerald-800/40 ml-2">
              ${cat.subcategories.map(sub => `
                <button onclick="selectSubcategory('${sub}')" class="w-full text-left px-3 py-1.5 rounded-lg text-xs ${currentSelectedSubcat === sub ? 'text-amber-400 font-bold bg-emerald-900/60' : 'text-gray-400 hover:text-amber-300 hover:bg-emerald-900/40'} transition flex items-center gap-1.5">
                  <span class="w-1 h-1 rounded-full bg-emerald-600"></span>
                  ${sub}
                </button>
              `).join('')}
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    // ฟังก์ชันพับ/คลี่ เมนูหมวดหมู่ย่อย
    function toggleCategoryAccordion(catId) {
      const subMenu = document.getElementById(`sub-${catId}`);
      const icon = document.getElementById(`icon-${catId}`);
      
      if (subMenu.classList.contains("hidden")) {
        subMenu.classList.remove("hidden");
        icon.classList.add("rotate-180");
      } else {
        subMenu.classList.add("hidden");
        icon.classList.remove("rotate-180");
      }
    }

    // ฟังก์ชันเมื่อคลิกเลือกหมวดหมู่ย่อย
    function selectSubcategory(subcat) {
      currentSelectedSubcat = subcat;
      
      // อัปเดตส่วนแสดงชื่อหมวดหมู่ที่เลือก
      document.getElementById("selected-cat-label").innerHTML = `<i data-lucide="grid" class="w-4 h-4 text-amber-400"></i> ${subcat}`;
      document.getElementById("mobile-category-title").innerText = subcat === 'ทั้งหมด' ? 'เลือกหมวดหมู่สินค้า' : subcat;

      // ไฮไลต์เมนูที่เลือกใหม่
      renderCategorySidebar();
      // กรองสินค้าที่แสดงใน Grid
      renderProducts(subcat);

      // ปิด Sidebar อัตโนมัติบนมือถือเมื่อเลือกหมวดหมู่เสร็จ
      if (window.innerWidth < 768) {
        toggleMobileSidebar(false);
      }
    }

    // แสดงรายการสินค้าใน Grid
    function renderProducts(subcatFilter) {
      const container = document.getElementById("product-grid");
      const countLabel = document.getElementById("product-count");

      const filtered = subcatFilter === 'ทั้งหมด' 
        ? mockProducts 
        : mockProducts.filter(p => p.subcat === subcatFilter);

      countLabel.innerText = `${filtered.length} รายการ`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-span-full text-center py-12 text-gray-400 bg-[#122a22]/30 rounded-2xl border border-emerald-900/30">
            <i data-lucide="package-open" class="w-10 h-10 mx-auto text-gray-500 mb-2"></i>
            <p class="text-xs md:text-sm">ไม่พบรายการสินค้าในหมวดหมู่ "${subcatFilter}"</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      container.innerHTML = filtered.map(p => `
        <div class="bg-[#122a22] rounded-xl overflow-hidden border border-emerald-800/40 card-hover flex flex-col justify-between shadow-md">
          <div class="relative w-full aspect-square img-skeleton overflow-hidden">
            <img src="${p.img}" alt="${p.name}" loading="lazy" class="w-full h-full object-cover opacity-0 transition-opacity duration-300" onload="this.classList.remove('opacity-0')">
          </div>
          <div class="p-3 flex flex-col justify-between flex-1">
            <h4 class="font-bold text-xs md:text-sm text-white line-clamp-2 leading-snug">${p.name}</h4>
            <div class="mt-2 pt-2 border-t border-emerald-900/40 flex items-baseline justify-between">
              <span class="text-[10px] text-gray-400">ราคา</span>
              <p class="text-amber-400 font-extrabold text-sm md:text-base">${p.price} <span class="text-[10px] text-gray-400 font-normal">บาท</span></p>
            </div>
          </div>
        </div>
      `).join('');

      lucide.createIcons();
    }

    // สลับการเปิด-ปิด เมนูหมวดหมู่สำหรับ Mobile หน้าจอเล็ก
    function toggleMobileSidebar(show) {
      const sidebar = document.getElementById("sidebar-container");
      
      if (show) {
        sidebar.classList.remove("hidden");
        sidebar.classList.add("fixed", "inset-0", "z-50", "bg-[#0a1f1a]", "p-6", "overflow-y-auto", "w-full", "h-full", "rounded-none");
      } else {
        sidebar.classList.add("hidden");
        sidebar.classList.remove("fixed", "inset-0", "z-50", "bg-[#0a1f1a]", "p-6", "overflow-y-auto", "w-full", "h-full", "rounded-none");
      }
    }
  </script>
</body>
</html>
